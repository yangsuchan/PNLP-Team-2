[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkenough"
version = "0.1.0"
description = "ThinkEnough: Hidden-state probing for early exit in multimodal Long CoT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# GPU server extras — install only with approval
server = [
    "transformers>=4.57.0",
    "accelerate>=0.33.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
